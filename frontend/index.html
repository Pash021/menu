<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>QR Մենյու</title>
    <script>
      (function () {
        try {
          var pathname = String(location.pathname || "");
          if (pathname.indexOf("/r/") !== 0) return;
          var parts = pathname.split("/").filter(Boolean);
          if (parts[0] !== "r" || !parts[1]) return;
          var slug = parts[1];
          var raw = localStorage.getItem("qrmenu_public_style:" + slug);
          if (!raw) return;
          var data = JSON.parse(raw);
          if (!data || data.v !== 1) return;

          var root = document.documentElement;

          if (data.fontSize && Number.isFinite(Number(data.fontSize))) {
            root.style.fontSize = String(data.fontSize) + "px";
          }

          var vars = data.vars || {};
          var varsCss = ":root{";
          for (var key in vars) {
            var value = vars[key];
            if (!value) continue;
            varsCss += key + ":" + value + ";";
          }
          varsCss += "}";
          if (varsCss !== ":root{}") {
            var varsStyle = document.createElement("style");
            varsStyle.id = "qrmenu-public-style-preload";
            varsStyle.textContent = varsCss;
            document.head.appendChild(varsStyle);
          }

          function extOf(url) {
            var file = String(url || "").split("?")[0].split("#")[0].split("/").pop() || "";
            var idx = file.lastIndexOf(".");
            if (idx === -1) return "";
            return file.slice(idx + 1).toLowerCase();
          }

          function formatOfExt(ext) {
            if (ext === "woff2") return "woff2";
            if (ext === "woff") return "woff";
            if (ext === "ttf") return "truetype";
            if (ext === "otf") return "opentype";
            return "woff2";
          }

          function preloadType(ext) {
            if (ext === "woff2") return "font/woff2";
            if (ext === "woff") return "font/woff";
            if (ext === "ttf") return "font/ttf";
            if (ext === "otf") return "font/otf";
            return "font/woff2";
          }

          var faces = Array.isArray(data.faces) ? data.faces : [];
          if (faces.length) {
            var faceCss = "";
            for (var i = 0; i < faces.length; i++) {
              var face = faces[i] || {};
              if (!face.family || !face.url) continue;
              var ext = extOf(face.url);
              var format = formatOfExt(ext);
              faceCss +=
                '@font-face{font-family:"' +
                face.family +
                '";src:url("' +
                face.url +
                '") format("' +
                format +
                '");font-display:swap;}';

              var preloadId = "qrmenu-preload-font:" + face.family;
              if (!document.getElementById(preloadId)) {
                var link = document.createElement("link");
                link.id = preloadId;
                link.rel = "preload";
                link.as = "font";
                link.type = preloadType(ext);
                link.crossOrigin = "anonymous";
                link.href = face.url;
                document.head.appendChild(link);
              }
            }

            if (faceCss) {
              var faceStyle = document.createElement("style");
              faceStyle.id = "qrmenu-public-fontfaces-preload";
              faceStyle.textContent = faceCss;
              document.head.appendChild(faceStyle);
            }
          }

          var loaderImageUrl = data.loaderImageUrl;
          if (typeof loaderImageUrl === "string" && loaderImageUrl) {
            var loaderLinkId = "qrmenu-preload-loader-image";
            if (!document.getElementById(loaderLinkId)) {
              var imgLink = document.createElement("link");
              imgLink.id = loaderLinkId;
              imgLink.rel = "preload";
              imgLink.as = "image";
              imgLink.href = loaderImageUrl;
              document.head.appendChild(imgLink);
            }
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
